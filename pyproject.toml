[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cookie-consent-auditor"
version = "1.0.0"
description = "Detects cookies set before consent and classifies them against known tracker signatures"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["playwright>=1.45"]

[project.scripts]
cookie-auditor = "cookie_auditor.cli:main"

[tool.setuptools]
packages = ["cookie_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
